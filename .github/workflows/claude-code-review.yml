# Claude reviews every push to a same-repository PR, alongside the Codex Cloud review.
#
# This file is identical in mojiroku, babyloop-dev and shape-polydisperse-granular-dev.
# Change all three together. Background and measurements: daichi-hotta/ops#61.
#
# Design (each point answers a failure of the earlier setup, removed or replaced on 2026-10-22):
#   - Claude only reads and returns JSON (--json-schema). The last step posts the result.
#     The earlier code-review plugin posted by itself and often posted nothing: it skipped
#     PRs it had already commented on and dropped most findings by design.
#   - Every tool Claude needs is listed in --allowedTools. One earlier run hit 40 permission
#     denials and still reported "No issues found". The summary now counts blocked tool calls
#     and warns when there are any; the run log lists each one.
#   - Claude reports fixed findings by the ids in context.md. The last step marks those comments,
#     and later runs leave them out, so a fix is announced once.
#   - Changed files are split across parallel subagents that read them in full, and the main
#     agent verifies their candidates. A single agent stopped after a few partial reads and
#     missed most of the findings Codex had made on the same diffs.
#   - If Claude returns nothing, the summary comment says so and the job fails. A broken
#     review must not look like a clean one.
#   - Actions are pinned to commit SHAs. On 2026-09-13 a floating @v1 broke every run.
#   - The action runs with GITHUB_TOKEN, so the Claude GitHub App is not needed (see github_token).
#
# Constraints kept from the earlier setup:
#   - Fork PRs are skipped with a job-level `if:` (a skipped job reports success, so this
#     stays safe if the check becomes required). Never use pull_request_target here.
#   - No --max-turns. A limit of 30 stopped a two-file review on 2026-08-22.
#
# Authentication: CLAUDE_CODE_OAUTH_TOKEN from `claude setup-token` (Max subscription,
# valid one year). Runs use the subscription's usage limits, not API billing.

name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# A new push cancels the review of the previous one. A manual re-run gets its own group, so an
# outdated re-run cannot cancel the current review; it then skips itself (see the context step).
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}${{ github.run_attempt != '1' && format('-rerun-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write # the last step posts the review with GITHUB_TOKEN
      issues: write # the summary is a PR conversation comment
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Write review context
        id: context
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            // A re-run of an older run would review a stale commit and overwrite the current summary.
            const { data: live } = await github.rest.pulls.get({ owner, repo, pull_number: pr.number });
            if (live.head.sha !== pr.head.sha) {
              core.notice(`Skipped: ${pr.head.sha.slice(0, 7)} is no longer the PR head (${live.head.sha.slice(0, 7)}).`);
              core.setOutput('stale', 'true');
              return;
            }
            const BOT = 'github-actions[bot]';
            // Our JSON block is the last marker in the summary; Claude's text cannot contain one (see clean).
            function readUnplaced(body) {
              const tag = '<!-- claude-review:unplaced ';
              const i = body ? body.lastIndexOf(tag) : -1;
              if (i < 0) return [];
              try {
                return JSON.parse(body.slice(i + tag.length, body.indexOf(' -->', i)));
              } catch (e) {
                return [];
              }
            }
            // Claude reports fixed findings by these ids. The post step computes the same ones.
            const unplacedId = (f) => 'u' + require('crypto').createHash('sha256')
              .update(JSON.stringify([f.severity, f.path, f.line, f.title])).digest('hex').slice(0, 8);
            const reviewComments = await github.paginate(github.rest.pulls.listReviewComments, {
              owner, repo, pull_number: pr.number, per_page: 100,
            });
            // A finding the post step marked as fixed is left out, so it is not reported as fixed again.
            const prior = reviewComments
              .filter((c) => c.user && c.user.login === BOT && c.body.includes('<!-- claude-review:finding -->')
                && !c.body.includes('<!-- claude-review:resolved'))
              .map((c) => {
                const title = c.body.split('\n')[0].replace(/\*\*/g, '');
                let where = `${c.path}:${c.line}`;
                if (c.subject_type === 'file') where = `${c.path} (file comment)`;
                else if (c.line == null) where = `${c.path} (outdated)`;
                return `- [c${c.id}] ${where}: ${title}`;
              });
            // Findings that could not be placed on the diff live in the summary comment.
            const issueComments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pr.number, per_page: 100,
            });
            const summary = issueComments.find((c) => c.user && c.user.login === BOT && c.body.includes('<!-- claude-review:summary -->'));
            for (const f of readUnplaced(summary && summary.body)) {
              prior.push(`- [${unplacedId(f)}] ${f.path}:${f.line} (summary only): ${f.severity} · ${f.title}`);
            }
            const text = [
              `# PR #${pr.number}: ${pr.title}`,
              '',
              `- base: ${pr.base.sha} (${pr.base.ref})`,
              `- head: ${pr.head.sha} (${pr.head.ref})`,
              '',
              '## Description',
              '',
              pr.body || '(empty)',
              '',
              '## Earlier Claude findings on this PR',
              '',
              prior.length ? prior.join('\n') : 'None.',
              '',
            ].join('\n');
            fs.mkdirSync('.claude-review', { recursive: true });
            fs.writeFileSync('.claude-review/context.md', text);

      - name: Review with Claude
        id: claude
        if: steps.context.outputs.stale != 'true'
        # Shorter than the job timeout, so a slow review still reaches the post step and is reported.
        timeout-minutes: 25
        uses: anthropics/claude-code-action@6b6870e649b5ff408753befeaee5fc7989d4e6a9 # v1.0.258
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The workflow's own token, not the Claude GitHub App. With the App token the action
          # refuses to run unless this file matches the default branch, so a PR into develop
          # fails whenever develop and main differ, and no change to this file can be tested.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            You are reviewing pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            The working tree is checked out at the PR head. Your findings are suggestions; you do not approve or block.

            Inputs
            - Read .claude-review/context.md first: PR title, description, base and head SHAs, and findings you already posted on earlier commits.
            - The change under review is `git diff BASE...HEAD`, using the two SHAs from context.md.

            Steps
            1. Run `git diff --stat BASE...HEAD`.
            2. Split the changed files into one to four groups by area (for example backend, core library, frontend, scripts and evaluation). Leave out lockfiles, generated files and binary assets. Every other changed file belongs to exactly one group. Use at least one group even for a small change; the subagents do the full reading, so do not review the files yourself instead.
            3. Launch one Task subagent per group, all in the same message, each with run_in_background set to false so its result comes back to you. Give each one the repository, BASE and HEAD, its file list, the PR title and description, the review questions below, and these instructions:
               - Read each of your files in full at HEAD with the Read tool, without offset or limit, and read `git diff BASE...HEAD -- <your files>`.
               - Follow calls out of your files into the rest of the repository where needed.
               - Return every candidate problem with path, line, the input or sequence of events, and the code path that produces the wrong result. Do not filter by confidence; the reviewer verifies.
            4. While they run, read the repository's AGENTS.md or CLAUDE.md (root and the directories of changed files) and note the rules that apply to the changed files.
            5. Wait until every subagent has returned. Then verify each returned candidate by reading the code yourself. Keep it when you can name the input or sequence of events and the code path that produces the wrong result; you do not need to run it. Drop the rest, and merge candidates that share one root cause.

            Review questions (give these to every subagent)
            - Purpose: what is this change for, according to the PR title, the description and AGENTS.md? Can it report success or look correct while that purpose is not met?
            - Contracts: do all producers and consumers agree on limits, formats, units, enum values and defaults? Compare prompt text with the validator, the frontend with the backend, and docs or ADRs with the code.
            - Lifecycle: what happens if the work is cancelled, retried, run twice, or interrupted by a restart? Does cancellation reach every new code path?
            - Concurrency: between a check and the write that depends on it, can a user edit or another job change the state?
            - Empty and cleared values: is an explicit user choice (an empty or cleared field) told apart from "never set"?
            - Parsing and normalization: does the order of steps matter? What about input in a slightly different form (a prefix, wrapping markup, whitespace, case, another language)?
            - Errors: is each error surfaced, swallowed, or mapped to a misleading message?
            - Rules: does the change break a rule in AGENTS.md or CLAUDE.md that applies to the file?

            What to report
            - P0: data loss, a security hole, or the product cannot start or release.
            - P1: ordinary use breaks or gives wrong results; should be fixed before merge.
            - P2: wrong behavior under a specific but realistic condition (a race, cancellation, an edge input, a platform difference), or a clear violation of a quoted AGENTS.md or CLAUDE.md rule.
            - Report a conditional bug as P2 when the condition can realistically occur. Do not drop it because it depends on inputs or state.
            - Report every confirmed problem. Merge findings that share one root cause into one.
            - Do not report: style or naming preferences, missing comments, anything a linter or compiler would catch, or problems that existed before this PR unless the PR makes them worse.

            Earlier findings
            - Do not repeat a finding listed in context.md, unless it is marked (outdated) and the problem is still in the new code.
            - If the new code fixes one, put its id into resolved_prior: the bracketed text at the start of its line in context.md, such as c1234567890 or u1a2b3c4d.

            Output
            - path is relative to the repository root. line is the line number in the head version, confirmed with Read. Pick a line inside the diff (an added line or a nearby context line). Use start_line for a multi-line range.
            - title: one short sentence naming the problem.
            - body: what goes wrong (a concrete input or sequence), why, and how to fix it. Three to six sentences. Quote the rule when citing AGENTS.md or CLAUDE.md.
            - summary: two to four sentences on what you checked and where you looked hardest. Write it even when there are no findings.
            - Write titles, bodies and the summary in the language this repository's AGENTS.md or CLAUDE.md prescribes for PR reviews; use English if it says nothing.
            - Do not post to GitHub, edit files, build, or run tests. A later step posts your JSON result.
          # Pin reasoning effort so a change in the CLI default does not change review depth.
          settings: '{"effortLevel": "high"}'
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "Task,Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git blame:*),Bash(gh pr view:*),Bash(gh pr diff:*)"
            --json-schema '{"type":"object","additionalProperties":false,"required":["summary","findings","resolved_prior"],"properties":{"summary":{"type":"string"},"resolved_prior":{"type":"array","items":{"type":"string"}},"findings":{"type":"array","items":{"type":"object","additionalProperties":false,"required":["severity","path","line","title","body"],"properties":{"severity":{"type":"string","enum":["P0","P1","P2"]},"path":{"type":"string"},"line":{"type":"integer","minimum":1},"start_line":{"type":"integer","minimum":1},"title":{"type":"string"},"body":{"type":"string"}}}}}}'

      - name: Post the review
        if: ${{ !cancelled() && steps.context.outputs.stale != 'true' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REVIEW_JSON: ${{ steps.claude.outputs.structured_output }}
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        with:
          script: |
            const fs = require('fs');
            const pr = context.payload.pull_request;
            const { owner, repo } = context.repo;
            const sha = pr.head.sha;
            const short = sha.slice(0, 7);
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const BOT = 'github-actions[bot]';
            const SUMMARY = '<!-- claude-review:summary -->';
            const FINDING = '<!-- claude-review:finding -->';
            const RESOLVED = '<!-- claude-review:resolved';
            const ICON = { P0: '🔴', P1: '🟠', P2: '🟡' };
            const RANK = { P0: 0, P1: 1, P2: 2 };
            // Claude's text must not open an HTML comment: it would hide the rest or fake a marker.
            const clean = (s) => String(s || '').replace(/<!--/g, '&lt;!--');
            // Our JSON block is the last marker in the summary; Claude's text cannot contain one (see clean).
            function readUnplaced(body) {
              const tag = '<!-- claude-review:unplaced ';
              const i = body ? body.lastIndexOf(tag) : -1;
              if (i < 0) return [];
              try {
                return JSON.parse(body.slice(i + tag.length, body.indexOf(' -->', i)));
              } catch (e) {
                return [];
              }
            }
            // The same ids as in the context step.
            const unplacedId = (f) => 'u' + require('crypto').createHash('sha256')
              .update(JSON.stringify([f.severity, f.path, f.line, f.title])).digest('hex').slice(0, 8);

            // A re-run is not cancelled by a newer push, so it may finish after the head moved on.
            const { data: live } = await github.rest.pulls.get({ owner, repo, pull_number: pr.number });
            if (live.head.sha !== sha) {
              core.notice(`Not posted: ${short} is no longer the PR head (${live.head.sha.slice(0, 7)}).`);
              return;
            }

            // The action saves every message of the run to this file, and the final result message lists
            // the tool calls that --allowedTools blocked. A partly blocked review must not look clean.
            let denials = null;
            try {
              const result = JSON.parse(fs.readFileSync(process.env.EXECUTION_FILE, 'utf8')).filter((m) => m && m.type === 'result').pop();
              if (result && Array.isArray(result.permission_denials)) denials = result.permission_denials;
            } catch (e) {
              core.warning(`No execution file to count blocked tool calls (${e.message}).`);
            }
            const tally = new Map();
            for (const d of denials || []) {
              const name = clean((d && d.tool_name) || 'unknown');
              tally.set(name, (tally.get(name) || 0) + 1);
              core.warning(`Blocked tool call: ${name} ${JSON.stringify((d && d.tool_input) || {}).slice(0, 300)}`);
            }
            const blocked = denials && denials.length
              ? [`⚠️ The permission settings blocked ${denials.length} tool call(s) (${[...tally].map(([k, v]) => `${k} ×${v}`).join(', ')}), so parts of this review may be missing. The run log lists each call.`, '']
              : [];
            const footer = `<sub>[Workflow run](${runUrl}) · blocked tool calls: ${denials ? denials.length : 'unknown'}</sub>`;

            const issueComments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pr.number, per_page: 100,
            });
            const previous = issueComments.find((c) => c.user && c.user.login === BOT && c.body.includes(SUMMARY));

            async function upsertSummary(text) {
              const body = [SUMMARY, '## Claude review', '', ...blocked, text, '', footer].join('\n');
              if (previous) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
              }
            }

            let review = null;
            try {
              review = JSON.parse(process.env.REVIEW_JSON || '');
            } catch (e) {
              review = null;
            }
            const heading = (f) => `**${ICON[f.severity]} ${f.severity} · ${f.title}**`;
            function summaryOnlySection(list) {
              if (!list.length) return [];
              const out = ['', '**Findings outside the diff**'];
              for (const f of list) out.push('', `${heading(f)} — \`${f.path}:${f.line}\``, '', f.body);
              // JSON stays inside an HTML comment, so escape every "-" to keep "--" out of it.
              const keep = list.map(({ severity, path, line, title, body }) => ({ severity, path, line, title, body }));
              out.push('', `<!-- claude-review:unplaced ${JSON.stringify(keep).replace(/-/g, '\\u002d')} -->`);
              return out;
            }
            const earlier = readUnplaced(previous && previous.body);

            if (!review || !Array.isArray(review.findings)) {
              // Keep findings that live only in the previous summary, so a failed run does not drop them.
              const note = `⚠️ The review of \`${short}\` did not finish. Nothing was checked; see the run log.`;
              await upsertSummary([note, ...summaryOnlySection(earlier)].join('\n'));
              core.setFailed('Claude returned no structured review.');
              return;
            }

            // Read before posting, so a comment posted by this run can never be marked as fixed.
            const reviewComments = await github.paginate(github.rest.pulls.listReviewComments, {
              owner, repo, pull_number: pr.number, per_page: 100,
            });
            const open = new Map(reviewComments
              .filter((c) => c.user && c.user.login === BOT && c.body.includes(FINDING) && !c.body.includes(RESOLVED))
              .map((c) => [`c${c.id}`, c]));

            const findings = review.findings
              .map((f) => ({ ...f, title: clean(f.title), body: clean(f.body) }))
              .sort((a, b) => RANK[a.severity] - RANK[b.severity]);
            const lineComment = (f) => {
              const c = { path: f.path, line: f.line, side: 'RIGHT', body: `${heading(f)}\n\n${f.body}\n\n${FINDING}` };
              if (f.start_line && f.start_line < f.line) Object.assign(c, { start_line: f.start_line, start_side: 'RIGHT' });
              return c;
            };

            // One review keeps it to one notification. If GitHub rejects any line, place them one by one:
            // on the line, else as a comment on the file, else in the summary.
            const unplaced = [];
            if (findings.length) {
              const counts = ['P0', 'P1', 'P2']
                .map((s) => [s, findings.filter((f) => f.severity === s).length])
                .filter(([, n]) => n)
                .map(([s, n]) => `${ICON[s]} ${s} ×${n}`)
                .join(' · ');
              const listReviews = () => github.paginate(github.rest.pulls.listReviews, { owner, repo, pull_number: pr.number, per_page: 100 });
              const before = new Set((await listReviews()).map((r) => r.id));
              try {
                await github.rest.pulls.createReview({
                  owner, repo, pull_number: pr.number, commit_id: sha, event: 'COMMENT',
                  body: `Claude review of \`${short}\`: ${counts}`,
                  comments: findings.map(lineComment),
                });
              } catch (e) {
                // An error can arrive after GitHub stored the review; never post the findings twice.
                const stored = (await listReviews()).some((r) => !before.has(r.id) && r.user && r.user.login === BOT && r.commit_id === sha);
                core.warning(`Batch review failed (${e.message}); ${stored ? 'it was stored anyway' : 'placing findings one by one'}.`);
                for (const f of stored ? [] : findings) {
                  try {
                    await github.rest.pulls.createReviewComment({ owner, repo, pull_number: pr.number, commit_id: sha, ...lineComment(f) });
                    continue;
                  } catch (err) {
                    core.warning(`Line ${f.path}:${f.line} is not in the diff (${err.message}).`);
                  }
                  try {
                    await github.rest.pulls.createReviewComment({
                      owner, repo, pull_number: pr.number, commit_id: sha, path: f.path, subject_type: 'file',
                      body: `${heading(f)}\n\nLine ${f.line}. ${f.body}\n\n${FINDING}`,
                    });
                  } catch (err) {
                    core.warning(`Could not place ${f.path}:${f.line}: ${err.message}`);
                    unplaced.push(f);
                  }
                }
              }
            }

            // Claude names fixed findings by their ids in context.md. A fixed inline finding gets a note and
            // the resolved marker, so the next context step leaves it out. A fixed summary-only finding is
            // no longer carried. Earlier findings stay listed until Claude reports them fixed.
            const ids = new Set();
            for (const r of review.resolved_prior || []) {
              const m = String(r).match(/\b[cu][0-9a-f]{8,}\b/);
              if (m) ids.add(m[0]);
              else core.warning(`resolved_prior entry without an id: ${String(r).slice(0, 200)}`);
            }
            const fixed = [];
            for (const id of ids) {
              const c = open.get(id);
              const f = earlier.find((e) => unplacedId(e) === id);
              if (c) {
                fixed.push(`- \`${c.path}${c.line ? `:${c.line}` : ''}\`: ${c.body.split('\n')[0].replace(/\*\*/g, '')}`);
                try {
                  await github.rest.pulls.updateReviewComment({
                    owner, repo, comment_id: c.id,
                    body: `${c.body}\n\n✅ Fixed in \`${short}\`, according to the Claude review.\n${RESOLVED} ${sha} -->`,
                  });
                } catch (e) {
                  core.warning(`Could not mark comment ${c.id} as fixed: ${e.message}`);
                }
              } else if (f) {
                fixed.push(`- \`${f.path}:${f.line}\` (summary only): ${f.severity} · ${f.title}`);
              } else {
                core.warning(`resolved_prior names no open finding: ${id}`);
              }
            }
            const carried = earlier.filter((f) => !ids.has(unplacedId(f)));
            const summaryOnly = [...unplaced, ...carried];

            const n = (s) => findings.filter((f) => f.severity === s).length;
            const lines = [findings.length
              ? `Commit \`${short}\`: ${findings.length} new finding(s) (P0 ${n('P0')} · P1 ${n('P1')} · P2 ${n('P2')}).`
              : `Commit \`${short}\`: no new findings.`];
            lines.push('', clean(review.summary));
            if (fixed.length) lines.push('', '**Fixed since the last review**', ...fixed);
            lines.push(...summaryOnlySection(summaryOnly));
            await upsertSummary(lines.join('\n'));
